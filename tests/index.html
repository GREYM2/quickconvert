<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickConvert tests</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/style.css">
<style>
  .layout h1 { font-size: 20px; }
  #results { list-style: none; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  #results li { padding: 8px 12px; border-radius: var(--radius); background: var(--surface); }
  #results .fail { color: var(--danger); }
  #results small { display: block; color: var(--muted); overflow-wrap: anywhere; }
</style>
<!-- Runs the worker modules directly on this page (no worker), so failures show plain stack traces. -->
<script src="../js/qc.js"></script>
<script src="../js/formats.js"></script>
<script src="../js/convert/zip.js"></script>
<script src="../js/convert/bmp.js"></script>
<script src="../js/convert/tiff.js"></script>
<script src="../js/convert/codecs.js"></script>
<script src="../js/convert/ico.js"></script>
<script src="../js/convert/image.js"></script>
<script src="../js/convert/markup.js"></script>
<script src="../js/convert/doc.js"></script>
<script src="../js/convert/docx.js"></script>
<script src="../js/convert/data.js"></script>
<script src="../js/convert/video.js"></script>
<script src="fixtures.js"></script>
</head>
<body>
<main class="layout">
  <h1>QuickConvert tests</h1>
  <p id="summary" class="muted">Running…</p>
  <ul id="results"></ul>
</main>
<script>
(async function () {
  'use strict';
  var results = [];
  function eq(a, b, msg) {
    var A = JSON.stringify(a), B = JSON.stringify(b);
    if (A !== B) throw new Error((msg ? msg + ': ' : '') + 'expected ' + B + ', got ' + A);
  }
  function ok(v, msg) { if (!v) throw new Error(msg || 'assertion failed'); }
  async function test(name, fn) {
    var t0 = performance.now();
    try { await fn(); results.push({ name: name, pass: true, ms: performance.now() - t0 }); }
    catch (e) { console.error(name, e); results.push({ name: name, pass: false, error: e.message }); }
  }
  function noop() {}
  function file(parts, name) { return new File(parts, name); }
  function settings(extra) { return Object.assign(QC.image.defaults(), extra || {}); }
  async function pixelsOf(blob) {
    var bm = await createImageBitmap(blob), c = new OffscreenCanvas(bm.width, bm.height), x = c.getContext('2d');
    x.drawImage(bm, 0, 0);
    return { width: bm.width, height: bm.height, data: x.getImageData(0, 0, bm.width, bm.height).data };
  }

  /* ---------- formats ---------- */

  await test('formats: detect by extension, MIME as fallback', function () {
    eq(QC.formats.detect('a.JPEG').key, 'jpg');
    eq(QC.formats.detect('table.tsv').key, 'tsv');
    eq(QC.formats.detect('page.HTM').key, 'html');
    eq(QC.formats.detect('conf.yml').key, 'yaml');
    eq(QC.formats.detect('noext', 'image/png').key, 'png');
    eq(QC.formats.detect('x.xyz', ''), null);
  });
  await test('formats: outputs per type, WebP hidden when not encodable', function () {
    eq(QC.formats.outputsFor('png', { webp: true }), ['jpg', 'png', 'webp', 'gif', 'bmp', 'tiff', 'tga', 'qoi', 'ico', 'pdf']);
    eq(QC.formats.outputsFor('png', { webp: false }), ['jpg', 'png', 'gif', 'bmp', 'tiff', 'tga', 'qoi', 'ico', 'pdf']);
    eq(['DSC_1.NEF', 'IMG_2.CR3', 'a.dng', 'art.psd', 'tex.tga', 'x.ppm', 'App.icns'].map(function (n) { return QC.formats.detect(n).key; }),
      ['raw', 'raw', 'raw', 'psd', 'tga', 'pnm', 'icns']);
    eq(['IMG_1.HEIC', 'scan.tif', 'clip.MTS', 'voice.opus', 'logo.svg'].map(function (n) { return QC.formats.detect(n).key; }), ['heic', 'tiff', 'ts', 'opus', 'svg']);
    eq(QC.formats.outputsFor('xlsx'), ['csv', 'tsv', 'ods', 'json', 'yaml', 'xml', 'html', 'md']);
    eq(QC.formats.groupsFor('json').map(function (g) { return g.label + ':' + g.keys.join(','); }),
      ['Data:json,yaml,xml', 'Tables:csv,tsv,xlsx,ods', 'Documents:html,md']);
    eq(QC.formats.groupsFor('gif').map(function (g) { return g.label; }), ['Images', 'Video', 'Documents']);
    eq([QC.formats.handler('gif', 'png'), QC.formats.handler('gif', 'mp4'), QC.formats.handler('mov', 'gif'), QC.formats.handler('csv', 'json'),
      QC.formats.handler('mp4', 'mp3'), QC.formats.handler('flac', 'wav')], ['image', 'media', 'media', 'data', 'media', 'media']);
    eq(QC.formats.groupsFor('mp4').map(function (g) { return g.label + ':' + g.keys.join(','); }),
      ['Video:mp4,webm,mov,mkv', 'Audio:mp3,m4a,aac,ogg,opus,flac,wav', 'Images:gif']);
    eq(QC.formats.outputName('photo.final.png', 'jpg'), 'photo.final.jpg');
    eq(QC.formats.outputName('noext', 'csv'), 'noext.csv');
  });

  /* ---------- zip ---------- */

  await test('zip: CRC-32 check value', function () {
    eq(QC.zip.crc32(new TextEncoder().encode('123456789')), 0xcbf43926);
  });
  await test('zip: clashing names get (2), (3)', function () {
    eq(QC.zip.uniqueNames(['a.jpg', 'a.jpg', 'A.JPG', 'b', 'b']), ['a.jpg', 'a (2).jpg', 'A (3).JPG', 'b', 'b (2)']);
  });
  await test('zip: archive structure (local headers, central directory, data)', async function () {
    var blob = await QC.zip.build([{ name: 'x.txt', blob: new Blob(['hello']) }, { name: 'x.txt', blob: new Blob(['wörld']) }]);
    var b = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(b.buffer);
    var end = b.length - 22;
    eq(dv.getUint32(end, true), 0x06054b50, 'end record');
    eq(dv.getUint16(end + 10, true), 2, 'entry count');
    var cd = dv.getUint32(end + 16, true), names = [], dec = new TextDecoder();
    for (var i = 0; i < 2; i++) {
      eq(dv.getUint32(cd, true), 0x02014b50, 'central header');
      var n = dv.getUint16(cd + 28, true), off = dv.getUint32(cd + 42, true), size = dv.getUint32(cd + 24, true);
      names.push(dec.decode(b.subarray(cd + 46, cd + 46 + n)));
      eq(dv.getUint32(off, true), 0x04034b50, 'local header');
      var data = b.subarray(off + 30 + n, off + 30 + n + size);
      eq(QC.zip.crc32(data), dv.getUint32(cd + 16, true), 'crc');
      cd += 46 + n;
    }
    eq(names, ['x.txt', 'x (2).txt']);
  });

  /* ---------- bmp / ico ---------- */

  await test('bmp: 24-bit header, padded bottom-up BGR rows, opens in the browser', async function () {
    var id = new ImageData(new Uint8ClampedArray([255, 0, 0, 255, 0, 255, 0, 255, 0, 0, 255, 255, 250, 250, 250, 255]), 2, 2);
    var b = QC.bmp.encode(id), dv = new DataView(b.buffer);
    eq(b.length, 54 + 8 * 2, 'size (rows padded to 8 bytes)');
    eq([b[0], b[1]], [0x42, 0x4d]);
    eq(dv.getUint16(28, true), 24);
    eq(Array.from(b.subarray(54, 60)), [255, 0, 0, 250, 250, 250], 'bottom row first, BGR');
    eq(Array.from(b.subarray(62, 68)), [0, 0, 255, 0, 255, 0], 'top row');
    var px = await pixelsOf(new Blob([b], { type: 'image/bmp' }));
    eq([px.width, px.height, px.data[0], px.data[1], px.data[2]], [2, 2, 255, 0, 0]);
  });
  await test('ico: PNG-in-ICO header', function () {
    var ico = QC.ico.wrapPng(new Uint8Array([1, 2, 3]), 256, 256), dv = new DataView(ico.buffer);
    eq(Array.from(ico.subarray(0, 8)), [0, 0, 1, 0, 1, 0, 0, 0]);
    eq([dv.getUint16(12, true), dv.getUint32(14, true), dv.getUint32(18, true)], [32, 3, 22]);
  });

  /* ---------- csv / tables ---------- */

  await test('csv: quotes, "" escapes, newlines in fields, CRLF, trailing empty field', function () {
    eq(QC.data.parseCSV('a,b\r\n"x, y","say ""hi"""\n"multi\nline",\n'), [['a', 'b'], ['x, y', 'say "hi"'], ['multi\nline', '']]);
  });
  await test('csv: delimiter detection ignores quoted text', function () {
    eq(QC.data.detectDelimiter('a;b;c\n1;2;3'), ';');
    eq(QC.data.detectDelimiter('a\tb'), '\t');
    eq(QC.data.detectDelimiter('"x;y;z",b,c'), ',');
  });
  await test('csv: write then parse gives the same rows; blank lines skipped', function () {
    var rows = [['a', 'b'], ['1,2', '"q"'], [' lead', 'x\ny']];
    eq(QC.data.parseCSV(QC.data.toCSV(rows)), rows);
    eq(QC.data.parseCSV('a\n\n\nb\n'), [['a'], ['b']]);
  });
  await test('values: only lossless numbers are inferred', function () {
    eq(['42', '007', '1.50', '1e3', ' 1', '-0', '3.25', ''].map(QC.data.inferValue), [42, '007', '1.50', '1e3', ' 1', '-0', 3.25, '']);
  });
  await test('tables: duplicate, empty and missing headers', function () {
    var o = QC.data.rowsToObjects([['a', 'a', ''], ['1', '2', '3', '4']], true).map(function (x) { return Object.assign({}, x); });
    eq(o, [{ a: 1, a_2: 2, column_3: 3, column_4: 4 }]);
  });
  await test('tables: JSON shapes become rows', function () {
    eq(QC.data.jsonToRows([{ a: 1 }, { b: 2 }]), [['a', 'b'], [1, ''], ['', 2]]);
    eq(QC.data.jsonToRows({ data: [{ x: 1 }] }), [['x'], [1]]);
    eq(QC.data.jsonToRows([[1, 2], [3, 4]]), [[1, 2], [3, 4]]);
    eq(QC.data.jsonToRows([1, 'a']), [['value'], [1], ['a']]);
    eq(QC.data.jsonToRows([{ n: { k: 1 }, z: null }]), [['n', 'z'], ['{"k":1}', '']]);
  });
  await test('csv: output separator, TSV quoting', function () {
    eq(QC.data.toCSV([['a;b', 'c'], ['1', '2']], ';'), '"a;b";c\r\n1;2\r\n');
    eq(QC.data.toCSV([['a,b', 'c\td']], '\t'), 'a,b\t"c\td"\r\n');
  });
  await test('json: JSON Lines are read as a list', function () {
    eq(QC.data.parseJSON('{"a":1}\n{"a":2}\n'), [{ a: 1 }, { a: 2 }]);
  });

  /* ---------- markup ---------- */

  function tags(node) {
    return (node.children || []).map(function (c) {
      return c.text !== undefined ? c.text : c.name + (c.children.length ? '(' + tags(c).join(',') + ')' : '');
    });
  }
  await test('html parser: implied end tags, void and raw elements, entities', function () {
    var t = QC.markup.parseHtml('<ul><li>a<li>b</ul><p>x<p>y &amp; z&nbsp;<br>w<script>if (a < b) "</p>"<' + '/script></p>' +
      '<table><tr><td>1<td>2<tr><td>3</table>');
    eq(tags(t), ['ul(li(a),li(b))', 'p(x)', 'p(y & z\u00a0,br,w,script(if (a < b) "</p>"))', 'table(tr(td(1),td(2)),tr(td(3)))']);
  });
  await test('xml parser: CDATA, attributes, namespaces', function () {
    var t = QC.markup.parseXml('<?xml version="1.0"?><w:doc a="1 &lt; 2"><w:t><![CDATA[<x>]]></w:t><e/></w:doc>');
    var doc = t.children[0];
    eq([doc.name, doc.attrs.a, QC.markup.textOf(doc), doc.children.length], ['w:doc', '1 < 2', '<x>', 2]);
  });
  await test('text decoding: UTF-8, BOMs, Windows-1251 guess', function () {
    var cp1251 = new Uint8Array([0xcf, 0xf0, 0xe8, 0xe2, 0xb3, 0xf2, 0x2c, 0x20, 0xf1, 0xe2, 0xb3, 0xf2]);   // Привіт, світ
    eq(QC.markup.decode(cp1251, 'auto'), { text: 'Привіт, світ', encoding: 'windows-1251' });
    eq(QC.markup.decode(new TextEncoder().encode('é'), 'auto').encoding, 'utf-8');
    eq(QC.markup.decode(new Uint8Array([0xff, 0xfe, 0x41, 0x00]), 'auto'), { text: 'A', encoding: 'utf-16le' });
    eq(QC.markup.decode(new Uint8Array([0xe9]), 'windows-1252').text, 'é');
  });

  /* ---------- documents ---------- */

  var PAGE = '<html><head><title>T</title></head><body><nav>menu</nav><main><h1>Title <small>x</small></h1>' +
    '<p>Some <b>bold</b>, <i>italic</i> and <a href="https://e.x/a b">a link</a>. 1. not a list * star</p>' +
    '<ul><li>one<ul><li>nested</li></ul></li><li>two</li></ul><ol start="3"><li>three</li></ol>' +
    '<pre><code class="language-js">let a = 1;\n</code></pre><blockquote><p>quote</p></blockquote>' +
    '<table><tr><th>A</th><th>B</th></tr><tr><td colspan="2">wide</td></tr><tr><td>1|2</td><td>3</td></tr></table></main></body></html>';

  await test('document: HTML -> Markdown', function () {
    var md = QC.doc.toMarkdown(QC.doc.fromHtml(PAGE, { mainOnly: true }));
    eq(md, '# Title x\n\nSome **bold**, *italic* and [a link](<https://e.x/a b>). 1. not a list \\* star\n\n' +
      '- one\n  - nested\n- two\n\n3. three\n\n```js\nlet a = 1;\n```\n\n> quote\n\n' +
      '| A | B |\n| --- | --- |\n| wide |   |\n| 1\\|2 | 3 |\n');
  });
  await test('document: HTML -> plain text, menus kept unless main content only', function () {
    var all = QC.doc.toText(QC.doc.fromHtml(PAGE));
    ok(all.indexOf('menu') === 0, 'nav kept');
    var txt = QC.doc.toText(QC.doc.fromHtml(PAGE, { mainOnly: true }));
    ok(txt.indexOf('Title x\n=======') === 0, txt.slice(0, 40));
    ok(txt.indexOf('a link (https://e.x/a b)') > 0, 'link target shown');
    ok(txt.indexOf('A     B\n----  -\nwide\n1|2   3') > 0, 'aligned table:\n' + txt);
  });
  await test('document: Markdown escaping survives a round trip (loads marked)', async function () {
    var doc = { title: '', blocks: [{ type: 'para', inlines: [{ text: '# not a heading *x* [y] <b>' }] }, { type: 'para', inlines: [{ text: '2. not a list' }] }] };
    var back = await QC.doc.fromMarkdown(QC.doc.toMarkdown(doc));
    eq(back.blocks.map(function (b) { return [b.type, QC.doc.plain(b.inlines)]; }), [['para', '# not a heading *x* [y] <b>'], ['para', '2. not a list']]);
  });

  // A .docx whose parts are deflate-compressed, the way Word saves them.
  async function deflateZip(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0;
    for (var i = 0; i < files.length; i++) {
      var name = enc.encode(files[i][0]), raw = enc.encode(files[i][1]);
      var comp = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 8, true);
      lh.setUint32(14, QC.zip.crc32(raw), true); lh.setUint32(18, comp.length, true); lh.setUint32(22, raw.length, true); lh.setUint16(26, name.length, true);
      parts.push(lh.buffer, name, comp);
      var cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(10, 8, true);
      cd.setUint32(16, QC.zip.crc32(raw), true); cd.setUint32(20, comp.length, true); cd.setUint32(24, raw.length, true);
      cd.setUint16(28, name.length, true); cd.setUint32(42, offset, true);
      central.push(cd.buffer, name);
      offset += 30 + name.length + comp.length;
    }
    var size = central.reduce(function (n, c) { return n + c.byteLength; }, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end.buffer])).arrayBuffer();
  }

  await test('docx: write then read keeps headings, lists, tables, links and marks', async function () {
    var doc = QC.doc.fromHtml('<h2>Head</h2><p>A <b>b</b> <a href="https://e.x">link</a> <code>c()</code></p>' +
      '<ol start="4"><li>four<ul><li>dot</li></ul></li><li>five</li></ol><table><tr><th>K</th><th>V</th></tr><tr><td>x</td><td>1</td></tr></table>' +
      '<blockquote><p>q</p></blockquote><pre>line 1\n  line 2</pre>');
    var blob = await QC.docx.write(doc, { font: 'Georgia', size: 12 });
    var zip = QC.zip.read(await blob.arrayBuffer());
    ok(zip.has('[Content_Types].xml') && zip.has('word/numbering.xml'), 'parts');
    ok((await zip.text('word/styles.xml')).indexOf('w:ascii="Georgia"') > 0, 'font');
    var back = await QC.docx.read(await blob.arrayBuffer());
    eq(QC.doc.toMarkdown(back), '## Head\n\nA **b** [link](https://e.x) `c()`\n\n4. four\n   - dot\n5. five\n\n' +
      '| K | V |\n| --- | --- |\n| x | 1 |\n\n> q\n\n```\nline 1\n  line 2\n```\n');
  });
  await test('docx: reads a deflate-compressed document with styles and numbering', async function () {
    var W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
    var buf = await deflateZip([
      ['word/document.xml', '<w:document ' + W + '><w:body>' +
        '<w:p><w:pPr><w:pStyle w:val="1"/></w:pPr><w:r><w:t>Заголовок</w:t></w:r></w:p>' +
        '<w:p><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">Bold </w:t></w:r><w:r><w:rPr><w:b w:val="0"/></w:rPr><w:t xml:space="preserve">not </w:t></w:r>' +
        '<w:hyperlink r:id="rId5"><w:r><w:t>site</w:t></w:r></w:hyperlink></w:p>' +
        '<w:p><w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="2"/></w:numPr></w:pPr><w:r><w:t>item</w:t></w:r></w:p>' +
        '<w:p></w:p></w:body></w:document>'],
      ['word/styles.xml', '<w:styles ' + W + '><w:style w:type="paragraph" w:styleId="1"><w:name w:val="heading 1"/></w:style></w:styles>'],
      ['word/numbering.xml', '<w:numbering ' + W + '><w:abstractNum w:abstractNumId="7"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/></w:lvl></w:abstractNum>' +
        '<w:num w:numId="2"><w:abstractNumId w:val="7"/></w:num></w:numbering>'],
      ['word/_rels/document.xml.rels', '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId5" Type="hyperlink" Target="https://example.com" TargetMode="External"/></Relationships>']
    ]);
    eq(QC.doc.toMarkdown(await QC.docx.read(buf)), '# Заголовок\n\n**Bold** not [site](https://example.com)\n\n1. item\n');
  });

  /* ---------- data ---------- */

  await test('xml: elements, attributes and repeats become JSON and back', function () {
    var v = QC.data.xmlToValue('<items v="1"><item id="a">x</item><item id="b"><n>2</n></item><e/></items>');
    eq(JSON.parse(JSON.stringify(v)), { items: { '@v': '1', item: [{ '@id': 'a', '#text': 'x' }, { '@id': 'b', n: '2' }], e: '' } });
    eq(QC.data.valueToXml(v, '2'), '<?xml version="1.0" encoding="UTF-8"?>\n<items v="1">\n  <item id="a">x</item>\n' +
      '  <item id="b">\n    <n>2</n>\n  </item>\n  <e/>\n</items>\n');
    eq(QC.data.valueToXml([{ 'a b': 1 }], 'min', 'row'), '<?xml version="1.0" encoding="UTF-8"?><root><row><a_b>1</a_b></row></root>');
    eq(QC.data.jsonToRows(v), [['@id', '#text', 'n'], ['a', 'x', ''], ['b', '', '2']]);
  });
  await test('data: JSON reformat, YAML round trip (loads js-yaml)', async function () {
    var src = file(['{"b":[1,{"z":true,"a":null}],"a":"x"}'], 'c.json');
    var min = await QC.data.convert(src, { from: 'json', to: 'json', doc: { indent: 'min', sortKeys: true } }, noop);
    eq(await min.blob.text(), '{"a":"x","b":[1,{"a":null,"z":true}]}');
    var y = await QC.data.convert(src, { from: 'json', to: 'yaml', doc: { indent: '2' } }, noop);
    eq(await y.blob.text(), 'b:\n  - 1\n  - z: true\n    a: null\na: x\n');
    var back = await QC.data.convert(file([y.blob], 'c.yaml'), { from: 'yaml', to: 'json', doc: { indent: 'min' } }, noop);
    eq(await back.blob.text(), '{"b":[1,{"z":true,"a":null}],"a":"x"}');
  });
  await test('data: tables from an HTML page, which table and header settings', async function () {
    var page = file(['<table><tr><td>skip</td></tr></table><table><tr><th>n</th><th>v</th></tr><tr><td>a</td><td>07</td></tr><tr><td>b</td><td>2</td></tr></table>'], 'p.html');
    var r = await QC.data.convert(page, { from: 'html', to: 'json', doc: { table: 1, indent: 'min' } }, noop);
    eq([await r.blob.text(), r.rows, r.note, r.info.tables.length], ['[{"n":"a","v":"07"},{"n":"b","v":2}]', 2, 'table 2 of 2', 2]);
    var noHead = await QC.data.convert(page, { from: 'html', to: 'json', doc: { table: 1, header: false, types: false, indent: 'min' } }, noop);
    eq(await noHead.blob.text(), '[["n","v"],["a","07"],["b","2"]]');
    var csv = await QC.data.convert(page, { from: 'html', to: 'csv', doc: { table: 1, csvDelimiter: ';', bom: false } }, noop);
    eq(await csv.blob.text(), 'n;v\r\na;07\r\nb;2\r\n');
  });
  await test('data: JSON -> HTML as a table or as a list, Markdown table', async function () {
    var list = file(['[{"a":1,"b":"x"},{"a":2}]'], 'l.json'), conf = file(['{"name":"app","opts":{"debug":true},"tags":[]}'], 'c.json');

  // A 2 s WebM: 10 coloured frames per second and a 440 Hz tone at half volume.
  async function makeVideo() {
    var M = await QC.loadCjs(QC.libs.mediabunny);
    var format = new M.WebMOutputFormat(), output = new M.Output({ format: format, target: new M.BufferTarget() });
    var canvas = new OffscreenCanvas(160, 120), ctx = canvas.getContext('2d');
    var codec = await M.getFirstEncodableVideoCodec(format.getSupportedVideoCodecs(), { width: 160, height: 120 });
    var video = new M.CanvasSource(canvas, { codec: codec, bitrate: M.QUALITY_MEDIUM });
    var audio = new M.AudioSampleSource({ codec: 'opus', bitrate: 64e3 });
    output.addVideoTrack(video);
    output.addAudioTrack(audio);
    await output.start();
    for (var i = 0; i < 20; i++) {
      ctx.fillStyle = 'hsl(' + i * 18 + ', 70%, 50%)';
      ctx.fillRect(0, 0, 160, 120);
      await video.add(i / 10, 0.1);
    }
    var tone = new Float32Array(48000 * 2);
    for (var k = 0; k < tone.length; k++) tone[k] = 0.5 * Math.sin(2 * Math.PI * 440 * k / 48000);
    await audio.add(new M.AudioSample({ data: tone, format: 'f32', numberOfChannels: 1, sampleRate: 48000, timestamp: 0 }));
    video.close();
    audio.close();
    await output.finalize();
    return new File([output.target.buffer], 'clip.webm', { type: 'video/webm' });
  }

  // Loudest sample of the file's sound between `from` and `to` seconds (default 0.2 to 1).
  async function peak(blob, from, to) {
    var M = await QC.loadCjs(QC.libs.mediabunny);
    var input = new M.Input({ source: new M.BlobSource(blob), formats: M.ALL_FORMATS });
    var track = await input.getPrimaryAudioTrack(), max = 0;
    for await (var sample of new M.AudioSampleSink(track).samples(from === undefined ? 0.2 : from, to || 1)) {
      var data = new Float32Array(sample.allocationSize({ planeIndex: 0, format: 'f32' }) / 4);
      sample.copyTo(data, { planeIndex: 0, format: 'f32' });
      for (var i = 0; i < data.length; i++) max = Math.max(max, Math.abs(data[i]));
      sample.close();
    }
    return max;
  }

  function u8(list) { return new Uint8Array(list); }
  async function readAs(type, bytes, name) {

  function be16(v) { return [v >> 8 & 255, v & 255]; }
  function be32(v) { return [v >>> 24 & 255, v >> 16 & 255, v >> 8 & 255, v & 255]; }

  await test('psd: flattened RGB + transparency, RLE rows', async function () {
    // 2 x 1: a red opaque pixel and a blue half-transparent one. Each row: a PackBits literal run.
    var rows = [[255, 0], [0, 0], [0, 255], [255, 128]];                    // R, G, B, A channels
    var packed = rows.map(function (r) { return [1].concat(r); });         // "copy the next 2 bytes"
    var head = [0x38, 0x42, 0x50, 0x53].concat(be16(1), [0, 0, 0, 0, 0, 0], be16(4), be32(1), be32(2), be16(8), be16(3));
    var bytes = head.concat(be32(0), be32(0), be32(0), be16(1));
    packed.forEach(function (r) { bytes = bytes.concat(be16(r.length)); });
    packed.forEach(function (r) { bytes = bytes.concat(r); });
    var px = await readAs('psd', u8(bytes), 'a.psd');
    eq([px.width, px.height, Array.from(px.data.subarray(0, 8))], [2, 1, [255, 0, 0, 255, 0, 0, 255, 128]]);

  await test('psd: 16-bit grayscale, uncompressed', async function () {
    var head = [0x38, 0x42, 0x50, 0x53].concat(be16(1), [0, 0, 0, 0, 0, 0], be16(1), be32(1), be32(2), be16(16), be16(1));
    var px = await readAs('psd', u8(head.concat(be32(0), be32(0), be32(0), be16(0), [0x80, 0x00, 0xff, 0xff])), 'g.psd');
    eq(Array.from(px.data.subarray(0, 8)), [128, 128, 128, 255, 255, 255, 255, 255]);
  });
  await test('tga: written then read back; bottom-up RLE file', async function () {
    var tga = await QC.image.convert(await quadrants(), { from: 'png', to: 'tga', settings: settings() }, noop);
    var px = await readAs('tga', new Uint8Array(await tga.blob.arrayBuffer()));
    eq([px.width, px.height, rgbAt(px, 10, 10), rgbAt(px, 390, 290)], [400, 300, [255, 0, 0], [255, 255, 0]]);
    // 2 x 2, 24-bit, RLE, rows from the bottom: a run of 2 green (bottom row), then 2 literal pixels (top row).
    var file = [0, 0, 10, 0, 0, 0, 0, 0, 0, 0, 0, 0, 2, 0, 2, 0, 24, 0, 0x81, 0, 255, 0, 0x01, 255, 0, 0, 0, 0, 255];
    var px2 = await readAs('tga', u8(file));
    eq([rgbAt(px2, 0, 0), rgbAt(px2, 1, 0), rgbAt(px2, 0, 1)], [[0, 0, 255], [255, 0, 0], [0, 255, 0]]);
  });
  await test('qoi: written then read back exactly', async function () {
    var c = new OffscreenCanvas(64, 48), x = c.getContext('2d');
    for (var i = 0; i < 300; i++) {
      x.fillStyle = 'rgba(' + (i * 37 % 256) + ',' + (i * 91 % 256) + ',' + (i * 13 % 256) + ',' + (i % 7 ? 1 : 0.5) + ')';
      x.fillRect(i * 7 % 64, i * 3 % 48, 5, 4);
    }
    var src = x.getImageData(0, 0, 64, 48);
    var r = await QC.codecs.read('qoi', new File([QC.codecs.qoi(src)], 'a.qoi'));
    var d = new OffscreenCanvas(64, 48).getContext('2d');
    d.drawImage(r, 0, 0);
    var got = d.getImageData(0, 0, 64, 48).data, same = true;
    for (var j = 0; j < got.length; j++) if (Math.abs(got[j] - src.data[j]) > (j % 4 === 3 ? 0 : 1)) { same = false; break; }
    ok(same, 'pixels differ at byte ' + j);
  });
  await test('netpbm: PPM text and binary, PGM, PBM text and binary', async function () {
    var enc = new TextEncoder();
    var p3 = await readAs('pnm', enc.encode('P3\n# comment\n2 1 255\n255 0 0  0 0 255\n'));
    eq([rgbAt(p3, 0, 0), rgbAt(p3, 1, 0)], [[255, 0, 0], [0, 0, 255]]);
    var p6 = await readAs('pnm', u8(Array.from(enc.encode('P6 1 1 255\n')).concat([10, 20, 30])));
    var p5 = await readAs('pnm', u8(Array.from(enc.encode('P5 1 1 65535\n')).concat([0xff, 0xff])));
    var p1 = await readAs('pnm', enc.encode('P1\n2 1\n10\n'));
    var p4 = await readAs('pnm', u8(Array.from(enc.encode('P4\n3 1\n')).concat([0x40])));
    eq([rgbAt(p6, 0, 0), rgbAt(p5, 0, 0), rgbAt(p1, 0, 0), rgbAt(p1, 1, 0), rgbAt(p4, 0, 0), rgbAt(p4, 1, 0)],
      [[10, 20, 30], [255, 255, 255], [0, 0, 0], [255, 255, 255], [255, 255, 255], [0, 0, 0]]);
  });
  await test('icns: the largest PNG inside', async function () {
    var png = new Uint8Array(await (await QC.image.convert(await quadrants(), { from: 'png', to: 'png', settings: settings() }, noop)).blob.arrayBuffer());
    var file = [0x69, 0x63, 0x6e, 0x73].concat(be32(16 + png.length), [0x69, 0x63, 0x31, 0x30], be32(8 + png.length), Array.from(png));
    var px = await readAs('icns', u8(file));
    eq([px.width, rgbAt(px, 390, 290)], [400, [255, 255, 0]]);
  });
  await test('raw: the camera picture inside, not the sensor data, turned upright', async function () {
    var c = new OffscreenCanvas(40, 20), x = c.getContext('2d');
    x.fillStyle = '#ff0000'; x.fillRect(0, 0, 20, 20); x.fillStyle = '#0000ff'; x.fillRect(20, 0, 20, 20);
    var jpeg = Array.from(new Uint8Array(await (await c.convertToBlob({ type: 'image/jpeg', quality: 0.95 })).arrayBuffer()));
    // TIFF header, IFD0 with one tag: orientation 6 (turn 90 degrees clockwise).
    var tiff = [0x49, 0x49, 42, 0, 8, 0, 0, 0, 1, 0, 0x12, 0x01, 3, 0, 1, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0];
    // "Sensor data": a bigger lossless JPEG (SOF3), which browsers can't show and must be skipped.
    var lossless = [0xff, 0xd8, 0xff, 0xc3, 0, 11, 8, 0, 1, 0, 1, 1, 1, 0x11, 0, 0xff, 0xda, 0, 8, 1, 1, 0, 0, 0, 0].concat(new Array(5000).fill(7), [0xff, 0xd9]);
    var px = await readAs('raw', u8(tiff.concat(lossless, jpeg)), 'photo.dng');
    eq([px.width, px.height], [20, 40]);
    var top = rgbAt(px, 10, 5), bottom = rgbAt(px, 10, 35);
    ok(top[0] > 200 && top[2] < 60 && bottom[2] > 200 && bottom[0] < 60, 'red on top, blue below: ' + JSON.stringify([top, bottom]));
  });
  await test('pdf: one page holding the JPEG, valid cross-reference table', async function () {
    var r = await QC.image.convert(await quadrants(), { from: 'png', to: 'pdf', settings: settings({ quality: 80 }) }, noop);
    var text = new TextDecoder('latin1').decode(new Uint8Array(await r.blob.arrayBuffer()));
    ok(text.indexOf('%PDF-1.4') === 0 && r.blob.type === 'application/pdf', 'header');
    var xref = +/startxref\n(\d+)/.exec(text)[1];
    eq(text.slice(xref, xref + 4), 'xref');
    var entries = text.slice(xref).split('\n').slice(3, 8).map(function (l) { return +l.slice(0, 10); });
    eq(entries.map(function (o) { return text.slice(o, o + 7); }), ['1 0 obj', '2 0 obj', '3 0 obj', '4 0 obj', '5 0 obj']);
    ok(text.indexOf('/MediaBox [0 0 300.00 225.00]') > 0 && text.indexOf('/Width 400 /Height 300') > 0, 'page and image size');
  });
  await test('preview: formats a browser can\u2019t show are previewed as PNG, sized as the real file', async function () {
    var bm = await createImageBitmap(await quadrants());
    var r = await QC.image.preview({ bitmap: bm, srcWidth: 400, srcHeight: 300, to: 'tiff', settings: settings() });
    eq([r.blob.type, r.estimate > 400 * 300 * 3], ['image/png', true]);
  });

  /* ---------- report ---------- */

  var failed = results.filter(function (r) { return !r.pass; }).length;
  document.getElementById('summary').textContent = (results.length - failed) + ' of ' + results.length + ' passed' + (failed ? ', ' + failed + ' failed' : '');
  var list = document.getElementById('results');
  results.forEach(function (r) {
    var li = document.createElement('li');
    li.className = r.pass ? '' : 'fail';
    li.textContent = (r.pass ? '✓ ' : '✗ ') + r.name;
    var small = document.createElement('small');
    small.textContent = r.pass ? Math.round(r.ms) + ' ms' : r.error;
    li.appendChild(small);
    list.appendChild(li);
  });
  window.testResults = results;
})();
</script>

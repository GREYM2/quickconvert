<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickConvert tests</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/style.css">
<style>
  .layout h1 { font-size: 20px; }
  #results { list-style: none; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  #results li { padding: 8px 12px; border-radius: var(--radius); background: var(--surface); }
  #results .fail { color: var(--danger); }
  #results small { display: block; color: var(--muted); overflow-wrap: anywhere; }
</style>
<!-- Runs the worker modules directly on this page (no worker), so failures show plain stack traces. -->
<script src="../js/qc.js"></script>
<script src="../js/formats.js"></script>
<script src="../js/convert/zip.js"></script>
<script src="../js/convert/bmp.js"></script>
<script src="../js/convert/ico.js"></script>
<script src="../js/convert/image.js"></script>
<script src="../js/convert/data.js"></script>
<script src="fixtures.js"></script>
</head>
<body>
<main class="layout">
  <h1>QuickConvert tests</h1>
  <p id="summary" class="muted">Running…</p>
  <ul id="results"></ul>
</main>
<script>
(async function () {
  'use strict';
  var results = [];
  function eq(a, b, msg) {
    var A = JSON.stringify(a), B = JSON.stringify(b);
    if (A !== B) throw new Error((msg ? msg + ': ' : '') + 'expected ' + B + ', got ' + A);
  }
  function ok(v, msg) { if (!v) throw new Error(msg || 'assertion failed'); }
  async function test(name, fn) {
    var t0 = performance.now();
    try { await fn(); results.push({ name: name, pass: true, ms: performance.now() - t0 }); }
    catch (e) { console.error(name, e); results.push({ name: name, pass: false, error: e.message }); }
  }
  function noop() {}
  function file(parts, name) { return new File(parts, name); }
  function settings(extra) { return Object.assign(QC.image.defaults(), extra || {}); }
  async function pixelsOf(blob) {
    var bm = await createImageBitmap(blob), c = new OffscreenCanvas(bm.width, bm.height), x = c.getContext('2d');
    x.drawImage(bm, 0, 0);
    return { width: bm.width, height: bm.height, data: x.getImageData(0, 0, bm.width, bm.height).data };
  }

  /* ---------- formats ---------- */

  await test('formats: detect by extension, MIME as fallback', function () {
    eq(QC.formats.detect('a.JPEG').key, 'jpg');
    eq(QC.formats.detect('table.tsv').key, 'csv');
    eq(QC.formats.detect('noext', 'image/png').key, 'png');
    eq(QC.formats.detect('x.xyz', ''), null);
  });
  await test('formats: outputs per type, WebP hidden when not encodable', function () {
    eq(QC.formats.outputsFor('png', { webp: true }), ['jpg', 'png', 'webp', 'bmp', 'ico']);
    eq(QC.formats.outputsFor('png', { webp: false }), ['jpg', 'png', 'bmp', 'ico']);
    eq(QC.formats.outputsFor('xlsx'), ['csv', 'json']);
    eq(QC.formats.outputName('photo.final.png', 'jpg'), 'photo.final.jpg');
    eq(QC.formats.outputName('noext', 'csv'), 'noext.csv');
  });

  /* ---------- zip ---------- */

  await test('zip: CRC-32 check value', function () {
    eq(QC.zip.crc32(new TextEncoder().encode('123456789')), 0xcbf43926);
  });
  await test('zip: clashing names get (2), (3)', function () {
    eq(QC.zip.uniqueNames(['a.jpg', 'a.jpg', 'A.JPG', 'b', 'b']), ['a.jpg', 'a (2).jpg', 'A (3).JPG', 'b', 'b (2)']);
  });
  await test('zip: archive structure (local headers, central directory, data)', async function () {
    var blob = await QC.zip.build([{ name: 'x.txt', blob: new Blob(['hello']) }, { name: 'x.txt', blob: new Blob(['wörld']) }]);
    var b = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(b.buffer);
    var end = b.length - 22;
    eq(dv.getUint32(end, true), 0x06054b50, 'end record');
    eq(dv.getUint16(end + 10, true), 2, 'entry count');
    var cd = dv.getUint32(end + 16, true), names = [], dec = new TextDecoder();
    for (var i = 0; i < 2; i++) {
      eq(dv.getUint32(cd, true), 0x02014b50, 'central header');
      var n = dv.getUint16(cd + 28, true), off = dv.getUint32(cd + 42, true), size = dv.getUint32(cd + 24, true);
      names.push(dec.decode(b.subarray(cd + 46, cd + 46 + n)));
      eq(dv.getUint32(off, true), 0x04034b50, 'local header');
      var data = b.subarray(off + 30 + n, off + 30 + n + size);
      eq(QC.zip.crc32(data), dv.getUint32(cd + 16, true), 'crc');
      cd += 46 + n;
    }
    eq(names, ['x.txt', 'x (2).txt']);
  });

  /* ---------- bmp / ico ---------- */

  await test('bmp: 24-bit header, padded bottom-up BGR rows, opens in the browser', async function () {
    var id = new ImageData(new Uint8ClampedArray([255, 0, 0, 255, 0, 255, 0, 255, 0, 0, 255, 255, 250, 250, 250, 255]), 2, 2);
    var b = QC.bmp.encode(id), dv = new DataView(b.buffer);
    eq(b.length, 54 + 8 * 2, 'size (rows padded to 8 bytes)');
    eq([b[0], b[1]], [0x42, 0x4d]);
    eq(dv.getUint16(28, true), 24);
    eq(Array.from(b.subarray(54, 60)), [255, 0, 0, 250, 250, 250], 'bottom row first, BGR');
    eq(Array.from(b.subarray(62, 68)), [0, 0, 255, 0, 255, 0], 'top row');
    var px = await pixelsOf(new Blob([b], { type: 'image/bmp' }));
    eq([px.width, px.height, px.data[0], px.data[1], px.data[2]], [2, 2, 255, 0, 0]);
  });
  await test('ico: PNG-in-ICO header', function () {
    var ico = QC.ico.wrapPng(new Uint8Array([1, 2, 3]), 256, 256), dv = new DataView(ico.buffer);
    eq(Array.from(ico.subarray(0, 8)), [0, 0, 1, 0, 1, 0, 0, 0]);
    eq([dv.getUint16(12, true), dv.getUint32(14, true), dv.getUint32(18, true)], [32, 3, 22]);
  });

  /* ---------- csv / tables ---------- */

  await test('csv: quotes, "" escapes, newlines in fields, CRLF, trailing empty field', function () {
    eq(QC.data.parseCSV('a,b\r\n"x, y","say ""hi"""\n"multi\nline",\n'), [['a', 'b'], ['x, y', 'say "hi"'], ['multi\nline', '']]);
  });
  await test('csv: delimiter detection ignores quoted text', function () {
    eq(QC.data.detectDelimiter('a;b;c\n1;2;3'), ';');
    eq(QC.data.detectDelimiter('a\tb'), '\t');
    eq(QC.data.detectDelimiter('"x;y;z",b,c'), ',');
  });
  await test('csv: write then parse gives the same rows; blank lines skipped', function () {
    var rows = [['a', 'b'], ['1,2', '"q"'], [' lead', 'x\ny']];
    eq(QC.data.parseCSV(QC.data.toCSV(rows)), rows);
    eq(QC.data.parseCSV('a\n\n\nb\n'), [['a'], ['b']]);
  });
  await test('values: only lossless numbers are inferred', function () {
    eq(['42', '007', '1.50', '1e3', ' 1', '-0', '3.25', ''].map(QC.data.inferValue), [42, '007', '1.50', '1e3', ' 1', '-0', 3.25, '']);
  });
  await test('tables: duplicate, empty and missing headers', function () {
    var o = QC.data.rowsToObjects([['a', 'a', ''], ['1', '2', '3', '4']], true).map(function (x) { return Object.assign({}, x); });
    eq(o, [{ a: 1, a_2: 2, column_3: 3, column_4: 4 }]);
  });
  await test('tables: JSON shapes become rows', function () {
    eq(QC.data.jsonToRows([{ a: 1 }, { b: 2 }]), [['a', 'b'], [1, ''], ['', 2]]);
    eq(QC.data.jsonToRows({ data: [{ x: 1 }] }), [['x'], [1]]);
    eq(QC.data.jsonToRows([[1, 2], [3, 4]]), [[1, 2], [3, 4]]);
    eq(QC.data.jsonToRows([1, 'a']), [['value'], [1], ['a']]);
    eq(QC.data.jsonToRows([{ n: { k: 1 }, z: null }]), [['n', 'z'], ['{"k":1}', '']]);
  });
  await test('markdown html -> plain text', function () {
    eq(QC.data.htmlToText('<h1>T</h1>\n<p>a &amp; b</p>\n<ul>\n<li>x</li>\n</ul>\n'), 'T\n\na & b\n\n- x\n');
  });

  /* ---------- image settings ---------- */

  await test('image: output size for percent, locked and unlocked pixels', function () {
    var cs = function (x) { return QC.image.computeSize(400, 300, settings(x)); };
    eq(cs({}), { width: 400, height: 300 });
    eq(cs({ resizeMode: 'percent', percent: 50 }), { width: 200, height: 150 });
    eq(cs({ resizeMode: 'pixels', width: '100', height: '999', lockAspect: true, lockDriver: 'w' }), { width: 100, height: 75 });
    eq(cs({ resizeMode: 'pixels', width: '999', height: '60', lockAspect: true, lockDriver: 'h' }), { width: 80, height: 60 });
    eq(cs({ resizeMode: 'pixels', width: '100', height: '60', lockAspect: false }), { width: 100, height: 60 });
  });
  await test('image: target size uses 1 KB = 1000 bytes', function () {
    eq(QC.image.targetBytes(settings({ targetOn: true, targetValue: '700', targetUnit: 'KB' })), 700000);
    eq(QC.image.targetBytes(settings({ targetOn: true, targetValue: '1.5', targetUnit: 'MB' })), 1500000);
    eq(QC.image.targetBytes(settings({ targetOn: false, targetValue: '700' })), 0);
  });

  /* ---------- end to end (runs on this page, not in a worker) ---------- */

  var png = await QCFixtures.photo(600, 400);
  var webp = document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0;

  await test('image: PNG converts to every output and the result decodes', async function () {
    var outs = ['jpg', 'png', 'bmp', 'ico'].concat(webp ? ['webp'] : []);
    for (var i = 0; i < outs.length; i++) {
      var r = await QC.image.convert(png, { to: outs[i], settings: settings() }, noop);
      var px = await pixelsOf(r.blob);
      var expect = outs[i] === 'ico' ? [256, 256] : [600, 400];
      eq([px.width, px.height], expect, outs[i]);
    }
  });
  await test('image: GIF gives the first frame', async function () {
    var r = await QC.image.convert(QCFixtures.gif(), { to: 'png', settings: settings() }, noop);
    var px = await pixelsOf(r.blob);
    eq(Array.from(px.data.subarray(0, 3)), [255, 0, 0]);
  });
  await test('image: nearest keeps hard pixels at 4x, smooth modes blend', async function () {
    var art = await QCFixtures.pixelArt(32, 32), counts = {};
    for (var mode of ['nearest', 'bilinear', 'high']) {
      var r = await QC.image.convert(art, { to: 'png', settings: settings({ resizeMode: 'percent', percent: 400, resample: mode }) }, noop);
      var px = await pixelsOf(r.blob), set = new Set();
      for (var i = 0; i < px.data.length; i += 4) set.add(px.data[i] << 16 | px.data[i + 1] << 8 | px.data[i + 2]);
      counts[mode] = set.size;
      eq([px.width, px.height], [128, 128]);
    }
    eq(counts.nearest, 3, 'nearest colours');
    ok(counts.bilinear > 3 && counts.high > 3, 'smooth modes add blended colours: ' + JSON.stringify(counts));
  });
  await test('image: lossy target size fits, quality chosen automatically', async function () {
    var r = await QC.image.convert(png, { to: 'jpg', settings: settings({ targetOn: true, targetValue: '30', targetUnit: 'KB' }) }, noop);
    ok(r.blob.size <= 30000, 'size ' + r.blob.size);
    ok(r.quality >= 1 && r.quality <= 100 && !r.unreachable, 'quality ' + r.quality);
  });
  await test('image: unreachable target reports the smallest size at quality 1', async function () {
    var r = await QC.image.convert(png, { to: 'jpg', settings: settings({ targetOn: true, targetValue: '0.1', targetUnit: 'KB' }) }, noop);
    eq([r.unreachable, r.quality], [true, 1]);
  });
  await test('image: PNG target size shrinks dimensions', async function () {
    var r = await QC.image.convert(png, { to: 'png', settings: settings({ targetOn: true, targetValue: '100', targetUnit: 'KB' }) }, noop);
    ok(r.blob.size <= 100000 && r.scale < 100 && r.width < 600, JSON.stringify({ size: r.blob.size, scale: r.scale }));
  });
  await test('data: CSV -> JSON -> XLSX -> CSV keeps every row and value (loads SheetJS)', async function () {
    var csv = QCFixtures.csv(500);
    var a = await QC.data.convert(file([csv], 'a.csv'), { from: 'csv', to: 'json' }, noop);
    var b = await QC.data.convert(file([a.blob], 'b.json'), { from: 'json', to: 'xlsx' }, noop);
    var c = await QC.data.convert(file([b.blob], 'c.xlsx'), { from: 'xlsx', to: 'csv' }, noop);
    eq([a.rows, b.rows, c.rows], [500, 500, 500]);
    eq(QC.data.parseCSV(await c.blob.text()), QC.data.parseCSV(csv));
  });

  /* ---------- report ---------- */

  var failed = results.filter(function (r) { return !r.pass; }).length;
  document.getElementById('summary').textContent = (results.length - failed) + ' of ' + results.length + ' passed' + (failed ? ', ' + failed + ' failed' : '');
  var list = document.getElementById('results');
  results.forEach(function (r) {
    var li = document.createElement('li');
    li.className = r.pass ? '' : 'fail';
    li.textContent = (r.pass ? '✓ ' : '✗ ') + r.name;
    var small = document.createElement('small');
    small.textContent = r.pass ? Math.round(r.ms) + ' ms' : r.error;
    li.appendChild(small);
    list.appendChild(li);
  });
  window.testResults = results;
})();
</script>
</body>
</html>

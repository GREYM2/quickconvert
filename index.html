<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickConvert: private file converter</title>
<meta name="description" content="Convert images and data files in your browser. Files never leave your device.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<script>
  // Apply a saved theme before first paint (logic lives in js/ui/theme.js).
  try { var t = localStorage.getItem('qc-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="css/style.css">

<!-- Worker modules: also loaded here so the worker can be rebuilt on file://. Keep in sync with js/worker.js. -->
<script defer src="js/qc.js"></script>
<script defer src="js/formats.js"></script>
<script defer src="js/convert/zip.js"></script>
<script defer src="js/convert/bmp.js"></script>
<script defer src="js/convert/tiff.js"></script>
<script defer src="js/convert/codecs.js"></script>
<script defer src="js/convert/ico.js"></script>
<script defer src="js/convert/image.js"></script>
<script defer src="js/convert/markup.js"></script>
<script defer src="js/convert/doc.js"></script>
<script defer src="js/convert/docx.js"></script>
<script defer src="js/convert/data.js"></script>
<script defer src="js/convert/video.js"></script>
<script defer src="js/convert/jobs.js"></script>
<!-- Page-only modules. -->
<script defer src="js/pool.js"></script>
<script defer src="js/ui/motion.js"></script>
<script defer src="js/ui/colorpicker.js"></script>
<script defer src="js/ui/theme.js"></script>
<script defer src="js/ui/preview.js"></script>
<script defer src="js/ui/crop.js"></script>
<script defer src="js/ui/panel.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">QuickConvert</span>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>

<!-- Phones: one column. Wide screens: file list on the left, settings for the selected file on the right. -->
<main class="layout">
  <p id="banner" class="banner" role="alert" hidden></p>
  <noscript><p class="banner">QuickConvert needs JavaScript to run.</p></noscript>

  <span id="summary" class="summary muted" hidden></span>
  <div id="actions" class="actions" hidden>
    <button id="clear-all" class="btn btn-quiet" type="button">Clear</button>
    <button id="zip-all" class="btn" type="button" hidden>Download all (ZIP)</button>
    <button id="convert-all" class="btn btn-primary" type="button">Convert</button>
  </div>

  <div class="col-main">
    <ul id="files" class="files"></ul>

    <button id="drop" class="drop" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      <span class="drop-title"><span class="drop-mouse">Drop or paste files here, or click to choose.</span><span class="drop-touch">Tap to choose files.</span></span>
      <span class="drop-sub">Images: JPG · PNG · HEIC · RAW · PSD · WebP · AVIF · GIF · TIFF · SVG · TGA · BMP · ICO · and more<br>Video: MP4 · MOV · WebM · MKV · TS · 3GP · Audio: MP3 · M4A · WAV · FLAC · OGG · Opus · AAC<br>Tables and data: CSV · TSV · XLSX · XLS · ODS · JSON · YAML · XML<br>Documents: Word · HTML · Markdown · TXT</span>
    </button>
    <input id="file-input" type="file" multiple hidden>
  </div>

  <aside id="side" class="col-side" aria-label="File settings">
    <div class="side-inner"></div>
  </aside>
</main>

<footer class="foot muted">Conversions run in your browser. Nothing is uploaded.</footer>

<template id="tpl-row">
  <li class="file">
    <div class="file-head">
      <div class="file-info">
        <button type="button" class="file-name"></button>
        <span class="file-meta muted"></span>
      </div>
      <div class="file-controls">
        <select class="select file-target" aria-label="Convert to"></select>
        <button type="button" class="icon-btn file-gear" aria-label="Settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 10.0L21.4 10.1L21.4 13.9L18.9 14.0L18.3 15.5L20.0 17.3L17.3 20.0L15.5 18.3L14.0 18.9L13.9 21.4L10.1 21.4L10.0 18.9L8.5 18.3L6.7 20.0L4.0 17.3L5.7 15.5L5.1 14.0L2.6 13.9L2.6 10.1L5.1 10.0L5.7 8.5L4.0 6.7L6.7 4.0L8.5 5.7L10.0 5.1L10.1 2.6L13.9 2.6L14.0 5.1L15.5 5.7L17.3 4.0L20.0 6.7L18.3 8.5Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button type="button" class="icon-btn file-remove" aria-label="Remove file" title="Remove">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <p class="file-warn" hidden>Large file (over 100 MB). Your device may run out of memory.</p>
    <div class="file-status" aria-live="polite"></div>
    <div class="file-panel"></div>
  </li>
</template>

<template id="tpl-panel">
  <div class="panel">
    <div class="panel-head">
      <div class="head-main">
        <div class="panel-title">
          <label class="name-edit" title="Rename the converted file">
            <input type="text" class="p-name" spellcheck="false" autocomplete="off" aria-label="Name of the converted file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
          </label>
          <span class="panel-sub muted"></span>
          <p class="name-tip"></p>
        </div>
        <div class="panel-top">
          <button type="button" class="btn copy-all">Copy settings to all files</button>
          <button type="button" class="btn btn-quiet reset">Reset</button>
        </div>
        <button type="button" class="icon-btn panel-close" aria-label="Hide settings" title="Hide settings">
          <svg class="i-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
          <svg class="i-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="head-confirm" hidden>
        <div class="confirm-text">
          <span class="confirm-question"></span>
          <span class="muted">Other images may get stretched or blurred.</span>
        </div>
        <div class="confirm-actions">
          <button type="button" class="btn btn-quiet copy-cancel">Cancel</button>
          <button type="button" class="btn copy-except">All except size</button>
          <button type="button" class="btn btn-primary copy-everything">Everything</button>
        </div>
      </div>
      <p class="hint is-warn p-name-note" data-morph="name-note" hidden></p>
    </div>

    <div class="panel-body">
      <div class="panel-settings">
        <div class="settings-grid">
          <div class="field" data-morph="f-target">
            <span class="field-label">Convert to</span>
            <select class="select p-target" aria-label="Convert to"></select>
          </div>

          <!-- Data and document files: each field shows only where it matters (QC.data.settingsFor). -->
          <div class="field" data-doc data-show="encoding" data-morph="f-encoding" hidden>
            <span class="field-label">Encoding</span>
            <select class="select d-encoding" aria-label="Text encoding of the file">
              <option value="auto">Auto-detect</option>
              <option value="utf-8">UTF-8</option>
              <option value="utf-16le">UTF-16</option>
              <option value="windows-1251">Windows-1251 (Cyrillic)</option>
              <option value="windows-1252">Windows-1252 (Western)</option>
            </select>
            <p class="hint d-encoding-note" data-morph="encoding-note" hidden></p>
          </div>

          <div class="field" data-doc data-show="delimiter" data-morph="f-delimiter" hidden>
            <span class="field-label">Separator in the file</span>
            <select class="select d-delimiter" aria-label="Separator in the file">
              <option value="auto">Auto-detect</option>
              <option value=",">Comma ,</option>
              <option value=";">Semicolon ;</option>
              <option value="&#9;">Tab</option>
              <option value="|">Pipe |</option>
            </select>
            <p class="hint d-delimiter-note" data-morph="delimiter-note" hidden></p>
          </div>

          <div class="field" data-doc data-show="sheet" data-morph="f-sheet" hidden>
            <span class="field-label">Sheet</span>
            <select class="select d-sheet" aria-label="Sheet"></select>
          </div>

          <div class="field" data-doc data-show="table" data-morph="f-table" hidden>
            <span class="field-label">Table on the page</span>
            <select class="select d-table" aria-label="Table on the page"></select>
          </div>

          <fieldset class="field" data-doc data-show="csvDelimiter" data-morph="f-csv" hidden>
            <legend class="field-label">Separator</legend>
            <div class="segmented">
              <label><input type="radio" class="d-csv" value=","><span>Comma</span></label>
              <label><input type="radio" class="d-csv" value=";"><span>Semicolon</span></label>
            </div>
            <p class="hint">Excel set to many European languages expects semicolons.</p>
          </fieldset>

          <fieldset class="field" data-doc data-show="indent" data-morph="f-indent" hidden>
            <legend class="field-label">Indent</legend>
            <div class="segmented">
              <label><input type="radio" class="d-indent" value="2"><span>2 spaces</span></label>
              <label><input type="radio" class="d-indent" value="4"><span>4</span></label>
              <label data-indent-all><input type="radio" class="d-indent" value="tab"><span>Tab</span></label>
              <label data-indent-all><input type="radio" class="d-indent" value="min"><span>Minify</span></label>
            </div>
          </fieldset>

          <fieldset class="field" data-doc data-show="layout" data-morph="f-layout" hidden>
            <legend class="field-label">Show data as</legend>
            <div class="segmented">
              <label><input type="radio" class="d-layout" value="auto"><span>Auto</span></label>
              <label><input type="radio" class="d-layout" value="table"><span>Table</span></label>
              <label><input type="radio" class="d-layout" value="list"><span>List</span></label>
            </div>
          </fieldset>

          <div class="field" data-doc data-show="docx" data-morph="f-docx" hidden>
            <span class="field-label">Font</span>
            <div class="inline docx-font">
              <select class="select d-docx-font" aria-label="Font of the Word document"></select>
              <select class="select d-docx-size" aria-label="Font size in points">
                <option value="10">10 pt</option><option value="11">11 pt</option><option value="12">12 pt</option><option value="14">14 pt</option>
              </select>
            </div>
          </div>

          <div class="field" data-doc data-show="options" data-morph="f-options" hidden>
            <span class="field-label">Options</span>
            <div class="checks">
              <label class="check" data-check="header"><input type="checkbox" class="d-header"><span>First row is the header</span></label>
              <label class="check" data-check="types"><input type="checkbox" class="d-types"><span>Read numbers as numbers</span></label>
              <label class="check" data-check="mainOnly"><input type="checkbox" class="d-main"><span>Main content only <span class="muted">(no menus, headers, footers)</span></span></label>
              <label class="check" data-check="bom"><input type="checkbox" class="d-bom"><span>Excel-friendly <span class="muted">(UTF-8 BOM)</span></span></label>
              <label class="check" data-check="sortKeys"><input type="checkbox" class="d-sort"><span>Sort keys A–Z</span></label>
            </div>
          </div>

          <!-- HTML output only: page background (text colour follows) and font. -->
          <fieldset class="field" data-doc data-show="page" data-morph="f-page" hidden>
            <legend class="field-label">Page background</legend>
            <div class="swatches">
              <!-- Page colours of the output document, not UI colours. -->
              <label class="swatch" title="White"><input type="radio" class="pg-pick" value="#ffffff" aria-label="White"><span style="--c:#ffffff"></span></label>
              <label class="swatch" title="Paper"><input type="radio" class="pg-pick" value="#f4ecd8" aria-label="Paper"><span style="--c:#f4ecd8"></span></label>
              <label class="swatch" title="Grey"><input type="radio" class="pg-pick" value="#2b2b2e" aria-label="Grey"><span style="--c:#2b2b2e"></span></label>
              <label class="swatch" title="Dark"><input type="radio" class="pg-pick" value="#121214" aria-label="Dark"><span style="--c:#121214"></span></label>
              <label class="swatch swatch-custom pg-custom" title="Pick a colour"><input type="radio" class="pg-pick" value="custom" aria-label="Custom colour"><span class="bg-custom-chip pg-chip"></span></label>
            </div>
            <p class="hint">The text turns dark or light to stay readable.</p>
          </fieldset>

          <div class="field" data-doc data-show="font" data-morph="f-font" hidden>
            <span class="field-label">Font</span>
            <select class="select pg-font" aria-label="Font">
              <option value="system">System sans-serif</option>
              <option value="serif">Serif</option>
              <option value="mono">Monospace</option>
              <option value="search">Search Google Fonts…</option>
            </select>
            <div class="font-search" data-morph="font-search" hidden>
              <input type="text" class="input font-name" placeholder="Type part of a name, e.g. rale" spellcheck="false" autocomplete="off"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-label="Search Google Fonts">
              <ul class="font-results" role="listbox" aria-label="Google Fonts" hidden></ul>
            </div>
            <p class="hint font-note" data-morph="font-note" hidden></p>
          </div>

          <div class="field" data-image data-show="quality" data-morph="f-quality">
            <span class="field-label">Quality</span>
            <div class="q-row">
              <input type="range" class="q-range" min="1" max="100" step="1" aria-label="Quality">
              <input type="number" class="input q-num" min="1" max="100" step="1" inputmode="numeric" aria-label="Quality, 1 to 100">
            </div>
            <p class="hint q-found" data-morph="q-found" hidden></p>
          </div>

          <fieldset class="field" data-image data-show="target" data-morph="f-size">
            <legend class="field-label">File size</legend>
            <div class="segmented">
              <label><input type="radio" class="t-mode" value="auto"><span>Auto</span></label>
              <label><input type="radio" class="t-mode" value="target"><span>Target</span></label>
            </div>
            <div class="inline t-inputs" data-morph="t-inputs">
              <input type="number" class="input t-value" min="0" step="any" inputmode="decimal" placeholder="e.g. 700" aria-label="Target size">
              <select class="select t-unit" aria-label="Unit"><option>KB</option><option>MB</option></select>
            </div>
            <p class="hint t-note" data-morph="t-note" hidden></p>
          </fieldset>

          <fieldset class="field" data-image data-show="background" data-morph="f-bg">
            <legend class="field-label">Background</legend>
            <div class="swatches">
              <!-- Image content colours, not UI colours. -->
              <label class="swatch" title="White"><input type="radio" class="bg-pick" value="#ffffff" aria-label="White"><span style="--c:#ffffff"></span></label>
              <label class="swatch" title="Black"><input type="radio" class="bg-pick" value="#000000" aria-label="Black"><span style="--c:#000000"></span></label>
              <label class="swatch swatch-custom bg-custom" title="Pick a colour"><input type="radio" class="bg-pick" value="custom" aria-label="Custom colour"><span class="bg-custom-chip"></span></label>
            </div>
            <p class="hint bg-hint"></p>
          </fieldset>

          <div class="field" data-image data-morph="f-crop">
            <span class="field-label">Crop</span>
            <div class="inline crop-row">
              <select class="select c-ratio" aria-label="Crop shape">
                <option value="none">No crop</option>
                <option value="free">Free</option>
                <option value="orig">Original shape</option>
                <option value="1:1">Square (1:1)</option>
                <option value="4:3">4:3</option>
                <option value="3:2">3:2</option>
                <option value="16:9">16:9</option>
                <option value="3:4">3:4 (tall)</option>
                <option value="2:3">2:3 (tall)</option>
                <option value="9:16">9:16 (tall)</option>
              </select>
              <button type="button" class="btn c-edit" hidden>Edit</button>
            </div>
            <p class="hint c-hint" data-morph="c-hint" hidden>Drag the box or a corner on the picture, or drag outside it to draw a new box.</p>
          </div>

          <fieldset class="field" data-image data-morph="f-resize">
            <legend class="field-label">Resize</legend>
            <div class="segmented">
              <label><input type="radio" class="r-mode" value="none"><span>Original</span></label>
              <label><input type="radio" class="r-mode" value="percent"><span>Percent</span></label>
              <label><input type="radio" class="r-mode" value="pixels"><span>Pixels</span></label>
            </div>
            <div class="inline r-percent" data-morph="r-percent">
              <input type="number" class="input r-pct" min="1" max="1000" step="any" inputmode="decimal" aria-label="Scale in percent">
              <span>%</span>
            </div>
            <div class="inline r-pixels" data-morph="r-pixels">
              <input type="number" class="input r-w" min="1" step="1" inputmode="numeric" aria-label="Width in pixels">
              <span>×</span>
              <input type="number" class="input r-h" min="1" step="1" inputmode="numeric" aria-label="Height in pixels">
              <button type="button" class="icon-btn r-lock" aria-label="Keep aspect ratio" title="Keep aspect ratio">
                <svg class="i-locked" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <svg class="i-unlocked" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></svg>
              </button>
            </div>
            <p class="hint r-info"></p>
          </fieldset>

          <!-- Video (and GIF to video). -->
          <fieldset class="field" data-video data-morph="f-vquality" hidden>
            <legend class="field-label">Quality</legend>
            <div class="segmented">
              <label class="v-keep"><input type="radio" class="v-quality" value="keep"><span>Keep</span></label>
              <label><input type="radio" class="v-quality" value="high"><span>High</span></label>
              <label><input type="radio" class="v-quality" value="medium"><span>Medium</span></label>
              <label><input type="radio" class="v-quality" value="low"><span>Low</span></label>
            </div>
            <p class="hint v-quality-hint"></p>
          </fieldset>

          <div class="field" data-video data-morph="f-vsize" hidden>
            <span class="field-label">Size</span>
            <select class="select v-height" aria-label="Video size">
              <option value="auto">Auto</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
              <option value="240">240p</option>
            </select>
          </div>

          <div class="field" data-video data-morph="f-vfps" hidden>
            <span class="field-label">Frame rate</span>
            <select class="select v-fps" aria-label="Frame rate">
              <option value="auto">Auto</option>
              <option value="60">60 fps</option>
              <option value="30">30 fps</option>
              <option value="24">24 fps</option>
              <option value="15">15 fps</option>
              <option value="10">10 fps</option>
            </select>
          </div>

          <div class="field" data-video data-morph="f-volume" hidden>
            <span class="field-label">Volume</span>
            <div class="q-row">
              <input type="range" class="v-vol" min="0" max="200" step="5" aria-label="Volume">
              <input type="number" class="input q-num v-vol-num" min="0" max="200" step="1" inputmode="numeric" aria-label="Volume in percent, 0 to 200">
            </div>
            <p class="hint v-vol-hint" data-morph="vol-hint" hidden></p>
          </div>

          <fieldset class="field" data-video data-morph="f-channels" hidden>
            <legend class="field-label">Channels</legend>
            <div class="segmented">
              <label><input type="radio" class="v-ch" value="auto"><span>Auto</span></label>
              <label><input type="radio" class="v-ch" value="2"><span>Stereo</span></label>
              <label><input type="radio" class="v-ch" value="1"><span>Mono</span></label>
            </div>
          </fieldset>

          <div class="field" data-video data-morph="f-rate" hidden>
            <span class="field-label">Sample rate</span>
            <select class="select v-rate" aria-label="Sample rate">
              <option value="auto">Auto (original)</option>
              <option value="48000">48 kHz</option>
              <option value="44100">44.1 kHz</option>
              <option value="32000">32 kHz</option>
              <option value="22050">22.05 kHz</option>
              <option value="16000">16 kHz (speech)</option>
            </select>
          </div>

          <div class="field" data-video data-morph="f-fade" hidden>
            <span class="field-label">Fade</span>
            <div class="inline fades">
              <select class="select v-fade-in" aria-label="Fade in"><option value="0">No fade in</option><option value="0.5">Fade in 0.5 s</option><option value="1">Fade in 1 s</option><option value="2">Fade in 2 s</option><option value="3">Fade in 3 s</option><option value="5">Fade in 5 s</option></select>
              <select class="select v-fade-out" aria-label="Fade out"><option value="0">No fade out</option><option value="0.5">Fade out 0.5 s</option><option value="1">Fade out 1 s</option><option value="2">Fade out 2 s</option><option value="3">Fade out 3 s</option><option value="5">Fade out 5 s</option></select>
            </div>
          </div>

          <div class="field" data-image data-morph="f-resample">
            <span class="field-label">Resampling</span>
            <select class="select rs" aria-label="Resampling" title="Used when enlarging and when shrinking. &quot;High&quot; is the browser's best filter (bicubic or similar, depends on the browser).">
              <option value="nearest">Nearest: pixelated, for pixel art</option>
              <option value="bilinear">Bilinear: smooth</option>
              <option value="high">Bicubic / high: smoothest</option>
            </select>
          </div>
        </div>
      </div>

      <div class="panel-preview" data-image data-morph="preview">
        <div class="crop-host" hidden></div>
        <div class="preview-host"></div>
        <div class="preview-foot">
          <div class="zoom-slot"></div>
          <p class="preview-stats" aria-live="polite"></p>
        </div>
      </div>

      <div class="panel-video" data-video data-morph="vpreview" hidden>
        <div class="v-stage">
          <video class="v-player" controls playsinline preload="metadata"></video>
          <img class="v-anim" alt="Animation" hidden>
        </div>
        <div class="trim" data-morph="trim" hidden>
          <div class="trim-bar">
            <div class="trim-rail"><span class="trim-sel"></span></div>
            <input type="range" class="trim-start" min="0" step="0.05" aria-label="Trim: start">
            <input type="range" class="trim-end" min="0" step="0.05" aria-label="Trim: end">
          </div>
          <p class="hint trim-times"></p>
        </div>
        <div class="preview-foot">
          <span class="segmented is-small view-toggle v-views" role="radiogroup" aria-label="Show" hidden></span>
          <p class="preview-stats v-stats" aria-live="polite"></p>
        </div>
      </div>

      <div class="panel-doc" data-doc data-morph="doc">
        <div class="doc-pane">
          <div class="doc-head"><span class="field-label">Original</span><span class="segmented is-small view-toggle src-views" role="radiogroup" aria-label="Show the original as" hidden></span><span class="hint doc-src-note"></span></div>
          <div class="doc-edit doc-box"><textarea class="doc-src" spellcheck="false" aria-label="Original content"></textarea></div>
          <div class="doc-src-view doc-box" hidden></div>
        </div>
        <div class="doc-pane">
          <div class="doc-head"><span class="field-label">Result</span><span class="segmented is-small view-toggle out-views" role="radiogroup" aria-label="Show the result as" hidden></span><span class="hint doc-out-note" aria-live="polite"></span></div>
          <div class="doc-out doc-box"></div>
        </div>
        <div class="doc-grip" role="separator" aria-orientation="horizontal" aria-label="Height of the text boxes" title="Drag to resize both boxes" tabindex="0"><span></span></div>
      </div>
    </div>
  </div>
</template>
</body>
</html>
